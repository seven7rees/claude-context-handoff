<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">claude-context-handoff</title>
  <desc id="d">A context window bar reaching the handoff threshold, then a handoff file, then a fresh pinned session.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f1b2d"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="0.72" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>

  <text x="64" y="150" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="42" font-weight="700" fill="#e6edf3">claude-context-handoff</text>
  <text x="64" y="204" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#9fb3c8">Write the handoff before Claude Code</text>
  <text x="64" y="240" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="27" fill="#9fb3c8">runs out of context, not after.</text>
  <rect x="64" y="266" width="120" height="4" rx="2" fill="#2dd4bf"/>

  <text x="640" y="88" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#7d93ab">context window</text>
  <rect x="640" y="100" width="576" height="28" rx="14" fill="#1b2940"/>
  <rect x="640" y="100" width="490" height="28" rx="14" fill="url(#fill)"/>
  <line x1="1130" y1="92" x2="1130" y2="140" stroke="#f8fafc" stroke-width="2"/>
  <text x="1130" y="162" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="16" fill="#f8fafc">85%</text>

  <rect x="640" y="196" width="210" height="96" rx="12" fill="#111c2e" stroke="#24354f"/>
  <text x="664" y="234" font-family="Consolas, Menlo, monospace" font-size="21" fill="#e6edf3">handoff.md</text>
  <text x="664" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8aa0b8">goal · decisions · next step</text>

  <line x1="856" y1="244" x2="930" y2="244" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="940" y="196" width="276" height="96" rx="12" fill="#111c2e" stroke="#2dd4bf"/>
  <text x="964" y="234" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#e6edf3">Project 2</text>
  <text x="964" y="264" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#8aa0b8">fresh session, already up to speed</text>
  <circle cx="1190" cy="224" r="8" fill="#2dd4bf"/>

  <text x="1216" y="336" text-anchor="end" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#9fb3c8">Pre-release. Illustration of the planned flow.</text>
</svg>
